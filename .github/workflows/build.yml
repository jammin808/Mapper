name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Every suite on Linux: headless OpenGL through Mesa (llvmpipe) under Xvfb, and FFmpeg 9.0's shared
  # libraries for the media suite (the binding's major version must match the libraries'). The image stays a bare
  # user machine with Microsoft's .NET: no VA-API, no system OpenAL (a sound server is not installed: Ubuntu's
  # PulseAudio pulls the distro FFmpeg and with it libva), so the suites prove the node falls back with words there.
  test:
    runs-on: ubuntu-latest
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/lib
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Headless OpenGL and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libgles2 libgl1 libglx-mesa0 libglfw3 libfontconfig1 fonts-dejavu-core
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: FFmpeg 9.0 shared libraries
        run: |
          mkdir -p .ffmpeg
          curl -sSL -o ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz"
          tar -xJf ff.tar.xz -C .ffmpeg --strip-components=1
          echo "$GITHUB_WORKSPACE/.ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore
      - name: Build (the analyzers are fences)
        run: dotnet build -c Release --no-restore
      - name: The machine is bare (no libva, no system OpenAL)
        run: |
          # The decode ladder's VA-API guard and the bundled OpenAL are proven here only while these are absent; on a machine
          # that has them, tools/without-libs.sh hides them for one command.
          present=$(ldconfig -p | grep -oE '(libva(-drm)?|libopenal)\.so\.[0-9]+' | sort -u | tr '\n' ' ')
          if [ -n "$present" ]; then echo "::error::the runner has $present; run the suites through tools/without-libs.sh"; exit 1; fi
      - name: Test (every project to its end; one crash hides no other result)
        run: |
          # A test that hangs is stopped after 5 minutes and named (no dump: a test host's dump is gigabytes), and the next
          # project runs.
          failed=""
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            echo "::group::$name"
            dotnet test "$project" -c Release --no-build --logger "trx;LogFileName=$name.trx" \
              --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      # The Companion module (integrations/companion-module-playmap): its type check, lint and tests — the e2e test against this
      # job's Release engine — then Companion's own module check. It runs whatever the .NET suites said.
      - name: Node for the Companion module
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: integrations/companion-module-playmap/package-lock.json
      - name: The Companion module (npm ci, npm test, npm run check)
        if: ${{ !cancelled() }}
        working-directory: integrations/companion-module-playmap
        env:
          PLAYMAP_ENGINE: ${{ github.workspace }}/tools/PlayMap.Node/bin/Release/net10.0/PlayMap.Node.dll
        run: |
          npm ci
          npm test
          npm run check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The Windows build: the exe the show machine runs. Its runner has no GPU and no audio endpoint; it builds
  # everything and runs the suites that need neither.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test (no GPU, no FFmpeg)
        run: |
          dotnet test tests/PlayMap.Core.Tests -c Release --no-build
          dotnet test tests/PlayMap.Engine.Tests -c Release --no-build
          dotnet test tests/PlayMap.Net.Tests -c Release --no-build
          dotnet test tests/PlayMap.Devices.Tests -c Release --no-build
          dotnet test tests/PlayMap.Assistant.Tests -c Release --no-build
          dotnet test tests/PlayMap.Vision.Tests -c Release --no-build
      - name: Test the Windows-only code (no GPU; WARP and the D3D11 paths)
        run: |
          dotnet test tests/PlayMap.Render.Tests -c Release --no-build --filter Category=Windows
          dotnet test tests/PlayMap.Media.Tests -c Release --no-build --filter Category=Windows
      - name: Publish the portable exe
        run: dotnet publish src/PlayMap.App -c Release -r win-x64 --self-contained true -o publish/PlayMap
      - name: Upload the exe
        uses: actions/upload-artifact@v5
        with:
          name: PlayMap-win-x64
          path: publish/PlayMap
