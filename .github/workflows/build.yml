name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Every suite on Linux: headless OpenGL through Mesa (llvmpipe) under Xvfb, and FFmpeg 9.0's shared
  # libraries for the media suite (the binding's major version must match the libraries').
  test:
    runs-on: ubuntu-latest
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/lib
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Headless OpenGL and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libgles2 libgl1 libglx-mesa0 libglfw3 libfontconfig1 fonts-dejavu-core
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: FFmpeg 9.0 shared libraries
        run: |
          mkdir -p .ffmpeg
          curl -sSL -o ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz"
          tar -xJf ff.tar.xz -C .ffmpeg --strip-components=1
          echo "$GITHUB_WORKSPACE/.ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore
      - name: Build (the analyzers are fences)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The Windows build: the exe the show machine runs. Its runner has no GPU and no audio endpoint; it builds
  # everything and runs the suites that need neither.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      # PowerShell goes on past a native command's exit code, so each project's result is taken from $LASTEXITCODE and the
      # step fails at its end naming every project that failed: one failure hides no other project's result.
      - name: Test (no GPU, no FFmpeg; every project to its end)
        run: |
          $failed = @()
          foreach ($name in 'PlayMap.Core.Tests', 'PlayMap.Engine.Tests', 'PlayMap.Net.Tests', 'PlayMap.Devices.Tests', 'PlayMap.Assistant.Tests', 'PlayMap.Vision.Tests') {
            Write-Output "::group::$name"
            dotnet test "tests/$name" -c Release --no-build --logger "trx;LogFileName=$name.trx"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Output "::endgroup::"
          }
          if ($failed.Count -gt 0) { Write-Output "::error::failed: $($failed -join ', ')"; exit 1 }
          exit 0
      - name: Test the Windows-only code (no GPU; WARP and the D3D11 paths)
        if: success() || failure()
        run: |
          $failed = @()
          foreach ($name in 'PlayMap.Render.Tests', 'PlayMap.Media.Tests') {
            Write-Output "::group::$name"
            dotnet test "tests/$name" -c Release --no-build --filter Category=Windows --logger "trx;LogFileName=$name.windows.trx"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Output "::endgroup::"
          }
          if ($failed.Count -gt 0) { Write-Output "::error::failed: $($failed -join ', ')"; exit 1 }
          exit 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      - name: Publish the portable exe
        run: dotnet publish src/PlayMap.App -c Release -r win-x64 --self-contained true -o publish/PlayMap
      - name: Upload the exe
        uses: actions/upload-artifact@v5
        with:
          name: PlayMap-win-x64
          path: publish/PlayMap
