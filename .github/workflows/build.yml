name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      d3d12:
        description: >-
          Run only the Direct3D 12 leg on Windows, narrowed by this dotnet test filter within Backend=D3D12
          (FullyQualifiedName~WarpDevice, say): its results, diff images, info-queue log and DRED output come back as artifacts.
          Empty runs both jobs whole.
        required: false
        default: ""
        type: string

jobs:
  # Every suite on Linux: headless OpenGL through Mesa (llvmpipe) under Xvfb, and FFmpeg 9.0's shared
  # libraries for the media suite (the binding's major version must match the libraries'). The image stays a bare
  # user machine with Microsoft's .NET: no VA-API, no system OpenAL (a sound server is not installed: Ubuntu's
  # PulseAudio pulls the distro FFmpeg and with it libva), so the suites prove the node falls back with words there.
  test:
    # A dispatched Direct3D 12 leg (the d3d12 input) is the Windows job's alone.
    if: ${{ !inputs.d3d12 }}
    runs-on: ubuntu-latest
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/lib
      DISPLAY: ":99"
      # The Media suite's native test doubles (the fake NDI runtime, libvmx) are built with the runner's cc and clang++; one that
      # does not build fails its tests here rather than skipping them.
      PLAYMAP_NATIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Headless OpenGL and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libgles2 libgl1 libglx-mesa0 libglfw3 libfontconfig1 fonts-dejavu-core
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: FFmpeg 9.0 shared libraries (LGPL, as the installer carries them)
        run: |
          # wp3-installer: FFmpeg 9.0.2's LGPL shared libraries (FFmpeg-Builds' lgpl-shared build of the same month as the Windows
          # job's, pinned by hash) are the ones every decode test loads, as the installer ships them; the GPL command-line build
          # (static, no libraries) is on the path only to encode test media with libx264 and libx265, in .ffmpeg/bin, never beside the
          # libraries or a test host.
          mkdir -p .ffmpeg/lib .ffmpeg/bin lgpl gpl
          curl -sSfL -o lgpl.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-lgpl-shared-9.0.tar.xz"
          echo "7a1ba2af36e5beeb98151e766a903b1d115f2206a86571f17f873cd7292c424f  lgpl.tar.xz" | sha256sum -c -
          curl -sSfL -o gpl.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-9.0.tar.xz"
          echo "68ee646831adaae2495618346f3bba94ff207ff83bbd34d643e7004730d66269  gpl.tar.xz" | sha256sum -c -
          tar -xJf lgpl.tar.xz -C lgpl --strip-components=1
          tar -xJf gpl.tar.xz -C gpl --strip-components=1
          cp -a lgpl/lib/*.so* .ffmpeg/lib/
          cp gpl/bin/ffmpeg gpl/bin/ffprobe .ffmpeg/bin/
          rm -rf lgpl gpl lgpl.tar.xz gpl.tar.xz
          echo "$GITHUB_WORKSPACE/.ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore
      - name: Build (the analyzers are fences)
        # A numbered build (Version.props): this run's number and commit; the build number is the run number less
        # PlayMapRunBase. The version is in the tree and the commit is the workflow's own, so no git history is read and the
        # checkout's default depth is enough.
        run: dotnet build -c Release --no-restore -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
      - name: The version
        # What the build stamped, read back from the built assembly and checked against this run's build number and commit; it
        # heads the job's summary whatever the suites say.
        shell: pwsh
        run: ./tools/ci-stamp.ps1 -File src/PlayMap.Core/bin/Release/net10.0/PlayMap.Core.dll -Label Linux -Heading
      - name: The machine is bare (no libva, no system OpenAL)
        run: |
          # The decode ladder's VA-API guard and the bundled OpenAL are proven here only while these are absent; on a machine
          # that has them, tools/without-libs.sh hides them for one command.
          present=$(ldconfig -p | grep -oE '(libva(-drm)?|libopenal)\.so\.[0-9]+' | sort -u | tr '\n' ' ')
          if [ -n "$present" ]; then echo "::error::the runner has $present; run the suites through tools/without-libs.sh"; exit 1; fi
      - name: Test (every project to its end; one crash hides no other result)
        run: |
          # A test that hangs is stopped after 5 minutes and named (no dump: a test host's dump is gigabytes), and the next
          # project runs.
          failed=""
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            echo "::group::$name"
            dotnet test "$project" -c Release --no-build --logger "trx;LogFileName=$name.trx" \
              --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none || failed="$failed $name"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - name: The Render suite on OpenGL ES 3.00 (the ES leg)
        # The whole Render suite again on an ES 3.00 context (GLFW on EGL under the same Xvfb), so the GL backend's pixels hold in
        # both dialects; its results are kept beside the core leg's under their own name. It runs whatever the suites above said.
        if: ${{ !cancelled() }}
        env:
          PLAYMAP_GL_DIALECT: es300
        run: |
          dotnet test tests/PlayMap.Render.Tests/PlayMap.Render.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=PlayMap.Render.Tests.es300.trx" \
            --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
      # The Companion module (integrations/companion-module-playmap): its type check, lint and tests — the e2e test against this
      # job's Release engine — then Companion's own module check. It runs whatever the .NET suites said.
      - name: Node for the Companion module
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v5
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: integrations/companion-module-playmap/package-lock.json
      - name: The Companion module (npm ci, npm test, npm run check)
        if: ${{ !cancelled() }}
        working-directory: integrations/companion-module-playmap
        env:
          PLAYMAP_ENGINE: ${{ github.workspace }}/tools/PlayMap.Node/bin/Release/net10.0/PlayMap.Node.dll
        run: |
          npm ci
          npm test
          npm run check
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The Windows build: the exe the show machine runs, and every suite to its end on a runner with no GPU and no audio
  # endpoint. Each project's exit code is checked on its own line: a multi-line pwsh step otherwise answers only its last
  # command's, and a failed suite before it would read as green. The runner is pinned to Windows Server 2025 (build 26100, the
  # floor the node's installer asks), and Direct3D 12 runs on WARP from NuGet beside the Agility SDK (tools/ci-d3d12.ps1): the
  # Backend=D3D12 tests are a leg of their own, listed apart in the summary. Dispatched with the d3d12 input, the job runs that
  # leg alone, narrowed by the input, and uploads what a reader on Linux needs to see a failure.
  windows:
    runs-on: windows-2025
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}\.ffmpeg\lib
      GALLIUM_DRIVER: llvmpipe
      # Where a Direct3D 12 test leaves its diff images, its info queue's messages and DRED's output (uploaded below).
      PLAYMAP_D3D12_EVIDENCE: ${{ github.workspace }}\d3d12-evidence
      # The dispatched leg's filter, read by the leg's script from the environment, never pasted into a command.
      D3D12_FILTER: ${{ inputs.d3d12 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: FFmpeg 9.0 shared libraries (LGPL, as the installer carries them)
        shell: pwsh
        run: |
          # wp3-installer: FFmpeg 9.0.2 as built by FFmpeg-Builds (https://github.com/BtbN/FFmpeg-Builds), pinned by hash. The LGPL
          # shared libraries (lgpl-shared) are the ones every decode test loads and the installer ships (.ffmpeg\lib); the GPL
          # command-line build (static, no DLLs) is on the path only to encode test media with libx264 and libx265 (.ffmpeg\bin),
          # never beside the libraries or a test host. The release is a month's last build, which that project keeps for two years.
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068'
          $pins = [ordered]@{
            'win64-lgpl-shared-9.0.zip' = '7157177B8A6CB2174C1650BA8C71B363F2C78CBA5330F88C4C02CF5B2B880646'
            'win64-gpl-9.0.zip' = 'A0E45723C72141975F51D8666302E614711745F3102B704CA3F82C897A58D278'
          }
          foreach ($name in $pins.Keys) {
            Invoke-WebRequest -Uri "$base-$name" -OutFile $name
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash
            if ($hash -ne $pins[$name]) { throw "$name is not the pinned build ($hash)" }
            Expand-Archive $name -DestinationPath ($name -replace '\.zip$', '')
          }
          New-Item -ItemType Directory -Force -Path .ffmpeg\lib, .ffmpeg\bin | Out-Null
          $lgpl = (Get-ChildItem 'win64-lgpl-shared-9.0' -Directory | Select-Object -First 1).FullName
          $gpl = (Get-ChildItem 'win64-gpl-9.0' -Directory | Select-Object -First 1).FullName
          Copy-Item (Join-Path $lgpl 'bin\*.dll') .ffmpeg\lib
          Copy-Item (Join-Path $gpl 'bin\ffmpeg.exe'), (Join-Path $gpl 'bin\ffprobe.exe') .ffmpeg\bin
          Get-ChildItem .ffmpeg -Recurse | Select-Object FullName, Length
      - name: OpenGL 3.3 in software (Mesa llvmpipe)
        shell: pwsh
        run: |
          # The runner has no GPU, and Windows' own opengl32 is GDI's OpenGL 1.1. Mesa 25.2.5 (MIT licence,
          # https://docs.mesa3d.org/license.html), as built for Windows by mesa-dist-win (https://github.com/pal1000/mesa-dist-win),
          # pinned by its hash; its opengl32.dll and the llvmpipe driver it loads go beside the test hosts after the build.
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/25.2.5/mesa3d-25.2.5-release-msvc.7z" -OutFile mesa.7z
          $hash = (Get-FileHash mesa.7z -Algorithm SHA256).Hash
          if ($hash -ne '24B082CD3B66115A7DDB355E69FA0332DD22C751A392AB61EA3F5C9F6C912B88') { throw "mesa.7z is not the pinned build ($hash)" }
          7z e mesa.7z -omesa x64/opengl32.dll x64/libgallium_wgl.dll | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract Mesa ($LASTEXITCODE)" }
          Get-ChildItem mesa
      - name: Direct3D 12 on WARP and the Agility SDK (pinned)
        # Microsoft.Direct3D.WARP and Microsoft.Direct3D.D3D12 (the Agility SDK, its debug layer included) from nuget.org at the
        # versions tools/ci-d3d12.ps1 pins, each .nupkg refused unless its SHA-256 is the pin's; the SDK version is read from the
        # package's d3d12.h. WARP's binaries are CI's only: nothing published carries them.
        shell: pwsh
        run: ./tools/ci-d3d12.ps1 -Restore -Into d3d12
      - name: Restore
        run: dotnet restore
      - name: Build
        # A numbered build (Version.props): this run's number and commit; no git history is read (see the Linux job).
        run: dotnet build -c Release --no-restore -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
      - name: The version
        # The built assembly's version resource, checked as on Linux, straight after the build: the job's summary names the build
        # whatever the suites say.
        shell: pwsh
        run: ./tools/ci-stamp.ps1 -File src/PlayMap.Core/bin/Release/net10.0/PlayMap.Core.dll -Label Windows -Heading
      - name: The native test doubles' compiler (the runner's LLVM clang)
        shell: pwsh
        run: |
          # The Media suite builds the fake NDI runtime (tests/native/fake_ndi.c, as Processing.NDI.Lib.x64.dll) and libvmx
          # (src/ThirdParty/libvmx, its upstream Windows clang command) with clang, which links through Visual Studio's linker
          # against the Windows SDK. A runner without clang fails here, and a double that does not build fails its tests (never a
          # suite that ran with them skipped).
          $ErrorActionPreference = 'Stop'
          $clang = (Get-Command clang.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            if ($vs) { $clang = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang.exe' }
          }
          if (-not $clang -or -not (Test-Path $clang)) { throw "no clang on the runner (LLVM, or Visual Studio's C++ Clang tools)" }
          $clangxx = Join-Path (Split-Path $clang) 'clang++.exe'
          if (-not (Test-Path $clangxx)) { throw "no clang++ beside $clang" }
          & $clang --version
          "PLAYMAP_CLANG=$clang" >> $env:GITHUB_ENV
          "PLAYMAP_CLANGXX=$clangxx" >> $env:GITHUB_ENV
          "PLAYMAP_NATIVE_REQUIRED=1" >> $env:GITHUB_ENV
      - name: OpenGL beside the test hosts
        shell: pwsh
        run: |
          # A test runs in testhost.exe beside its assembly or in dotnet.exe; Windows looks for opengl32.dll beside the exe first.
          # Both DLLs reach every test project's Release output: a missing DLL, no test project or a project with no output fails
          # here, never as a suite that ran on GDI's OpenGL 1.1.
          $ErrorActionPreference = 'Stop'
          $dlls = 'opengl32.dll', 'libgallium_wgl.dll' | ForEach-Object { (Get-Item "mesa/$_").FullName }
          $projects = @(Get-ChildItem tests/*/*.csproj)
          if ($projects.Count -eq 0) { throw 'no test project matches tests/*/*.csproj' }
          foreach ($project in $projects) {
            $dir = Join-Path $project.DirectoryName 'bin/Release/net10.0'
            if (-not (Test-Path $dir -PathType Container)) { throw "$($project.BaseName) has no Release output at $dir" }
            Copy-Item $dlls $dir
          }
          Copy-Item $dlls (Split-Path (Get-Command dotnet).Source)
      - name: Test (every project to its end; one crash hides no other result)
        if: ${{ !inputs.d3d12 }}
        shell: pwsh
        run: |
          # A test that hangs is stopped after 5 minutes and named (no dump: a test host's dump is gigabytes), and the next
          # project runs. No test project fails the step, and so does a suite that answers 0 but leaves no results file. The
          # Backend=D3D12 tests run in the Direct3D 12 leg below, so each result is counted once.
          $failed = @()
          $projects = @(Get-ChildItem tests/*/*.csproj)
          if ($projects.Count -eq 0) { Write-Host "::error::no test project matches tests/*/*.csproj"; exit 1 }
          foreach ($project in $projects) {
            $name = $project.BaseName
            Write-Host "::group::$name"
            dotnet test $project.FullName -c Release --no-build --filter "Backend!=D3D12" --logger "trx;LogFileName=$name.trx" `
              --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            elseif (-not (Test-Path (Join-Path $project.DirectoryName "TestResults/$name.trx"))) { $failed += "$name(no results)" }
            Write-Host "::endgroup::"
          }
          # Every failed test with the first lines of its message, read from the results, so the whole list is at the log's end.
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          foreach ($trx in Get-ChildItem tests/*/TestResults/*.trx -Exclude *.d3d12.trx) {
            foreach ($hit in Select-Xml -Path $trx.FullName -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns) {
              $message = ($hit.Node.Output.ErrorInfo.Message -split "`n" | Select-Object -First 4) -join ' | '
              Write-Host "FAILED $($trx.BaseName): $($hit.Node.testName) :: $message"
            }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::failed: $($failed -join ' ')"; exit 1 }
          exit 0
      - name: Direct3D 12 beside the test hosts
        # After the suites above, so they ran on Windows' own WARP as before: d3d10warp.dll beside every test project's Release
        # host and dotnet.exe, and the Agility runtime in a D3D12 folder beside each; PLAYMAP_D3D12_REQUIRED=1 then makes the
        # Direct3D 12 tests assert the pinned WARP made their devices.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/ci-d3d12.ps1 -Beside -From d3d12
      - name: Direct3D 12 on WARP (the Backend=D3D12 leg, listed apart)
        # Every test project's Backend=D3D12 tests with results files of their own (<project>.d3d12.trx), each result and the
        # leg's minutes in the summary; narrowed by the dispatched d3d12 input when it is given. It runs whatever the suites above
        # said, and fails when a Direct3D 12 test failed or none ran.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tools/ci-d3d12.ps1 -Leg -Filter "$env:D3D12_FILTER"
      - name: The runner's answers (M7, M14)
        # bench/r3-probe asks Windows on this runner and writes each answer, yes or no, in the summary; it fails only when it
        # writes none. M9's session calls are asked again as LocalSystem, through a scheduled task, the way the supervisor asks.
        if: ${{ !cancelled() && !inputs.d3d12 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build bench/r3-probe/PlayMap.Bench.Probe.csproj -c Release -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "the probe did not build ($LASTEXITCODE)" }
          $bin = (Resolve-Path bench/r3-probe/bin/Release/net10.0).Path
          New-Item -ItemType Directory -Force -Path (Join-Path $bin 'D3D12') | Out-Null
          Copy-Item d3d12/d3d10warp.dll $bin
          Copy-Item d3d12/D3D12/* (Join-Path $bin 'D3D12')
          $exe = Join-Path $bin 'PlayMap.Bench.Probe.exe'
          $answers = Join-Path $env:RUNNER_TEMP 'probe.md'
          & $exe --out $answers --sdk $env:PLAYMAP_AGILITY_SDK
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $answers)) { throw "the probe wrote no answers ($LASTEXITCODE)" }
          Get-Content $answers | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          # As LocalSystem: a scheduled task runs the probe's session questions and the step waits up to 90 s for its answers.
          $system = Join-Path $env:RUNNER_TEMP 'probe-system.md'
          $task = 'PlayMap probe as LocalSystem'
          $action = New-ScheduledTaskAction -Execute $exe -Argument "--session --out `"$system`""
          $principal = New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          # A task the runner refuses to make, start or remove is an answer ("could not be asked"), never the step's failure; an answer
          # file the task wrote is read first, so a refusal to remove the task keeps a real answer.
          $why = $null
          try {
            Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Force | Out-Null
            try {
              Start-ScheduledTask -TaskName $task
              $deadline = [DateTime]::UtcNow.AddSeconds(90)
              while (-not (Test-Path $system) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 2 }
            }
            finally {
              Unregister-ScheduledTask -TaskName $task -Confirm:$false
            }
          }
          catch { $why = $_.Exception.Message }
          $lines = if (Test-Path $system) {
            Get-Content $system
          } elseif ($why) {
            "#### M9's calls as LocalSystem", '', "The scheduled task as LocalSystem could not be asked: $why", ''
          } else {
            "#### M9's calls as LocalSystem", '', 'The scheduled task as LocalSystem wrote no answer within 90 s: the calls could not be asked that way here.', ''
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          Get-Content $answers, $system -ErrorAction SilentlyContinue | Write-Host
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      - name: Upload the Direct3D 12 evidence
        # Diff images, the info queue's messages and DRED's output, one folder per Direct3D 12 test, with the leg's results.
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: d3d12-evidence
          path: |
            d3d12-evidence/
            tests/*/TestResults/*.d3d12.trx
          if-no-files-found: ignore
      - name: The lab's bench (built, not run)
        # bench/r3-present answers M1 and M3 on real displays in the lab (L1, L4); the runner has no GPU, so it is only built here,
        # against this tree, to stay buildable while it waits.
        if: ${{ !cancelled() && !inputs.d3d12 }}
        run: dotnet build bench/r3-present/PlayMap.Bench.Present.csproj -c Release -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
      - name: Publish the portable exe
        if: ${{ !inputs.d3d12 }}
        # Publishing compiles again for win-x64, so it is given the same build number and commit as the build.
        run: dotnet publish src/PlayMap.App -c Release -r win-x64 --self-contained true -o publish/PlayMap -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
      - name: The published exe's version
        if: ${{ !inputs.d3d12 }}
        id: version
        # The published exe's Windows version resource, checked against this run's build number and commit: it names the artifact.
        shell: pwsh
        run: ./tools/ci-stamp.ps1 -File publish/PlayMap/PlayMap.exe -Label 'The published exe' -Artifact 'PlayMap-{0}-win-x64-unsigned'
      - name: The portable folder's SHA256SUMS (unsigned)
        # wp3-installer: the build is unsigned (the owner's decision, docs/round3/PLAN.md §9 decision 2): its name says so, and a
        # SHA256SUMS file of every shipped file rides beside them, which docs/INSTALL.md says how to check.
        if: ${{ !inputs.d3d12 }}
        shell: pwsh
        run: ./installer/sums.ps1 -Folder publish/PlayMap -Notice
      - name: Upload the exe
        if: ${{ !inputs.d3d12 }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: publish/PlayMap

  # wp3-installer: the installer's block (docs/round3/PLAN.md §3.5). wix-toolset answers M17 on the runner: the WiX toolset built from
  # its MS-RL source at the tag installer/wix/toolset.json pins (cached by the tag's commit and the build script), its minutes and the
  # feed's size, the restore of WixToolset.* from that feed alone, and whether the self-built tool asks for the licence gesture, which
  # is never passed. installer builds PlayMap's installer with Inno Setup (the fallback §9 decision 3 names while the self-built tool
  # asks and no patch to the pinned source answers it), proves its life cycle elevated on the runner, checks the release order, and
  # publishes the unsigned installer with its SHA256SUMS.
  wix-toolset:
    if: ${{ !inputs.d3d12 }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: The pin
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content installer/wix/toolset.json -Raw | ConvertFrom-Json
          $key = (Get-FileHash installer/wix/toolset.json).Hash.Substring(0, 12) + '-' + (Get-FileHash installer/wix/build-toolset.cmd).Hash.Substring(0, 12)
          "commit=$($pin.commit)", "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
      - name: The toolset's cache
        id: cache
        uses: actions/cache@v4
        with:
          path: wix-feed
          key: wix-toolset-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.key }}
      - name: Build the WiX toolset from its source (M17)
        if: steps.cache.outputs.cache-hit != 'true'
        id: build
        # A toolset that does not build within the job is M17's answer, not this run's failure: the next step says it.
        continue-on-error: true
        timeout-minutes: 180
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content installer/wix/toolset.json -Raw | ConvertFrom-Json
          $src = Join-Path $env:RUNNER_TEMP 'wix'
          git config --global core.autocrlf false
          git init -q $src
          git -C $src fetch -q --depth 1 $pin.repository $pin.commit
          if ($LASTEXITCODE -ne 0) { throw "the pinned commit $($pin.commit) could not be fetched" }
          git -C $src checkout -q FETCH_HEAD
          if ((git -C $src rev-parse HEAD) -ne $pin.commit) { throw "the checkout is not the pinned commit $($pin.commit)" }
          # The packages carry a version of PlayMap's own (the tag with its suffix), so none is ever taken for nuget.org's.
          git -C $src tag "$($pin.tag)-$($pin.suffix)"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          cmd /c "`"$dev`" -no_logo && `"$PWD\installer\wix\build-toolset.cmd`" `"$src\src`""
          $code = $LASTEXITCODE
          $minutes = [math]::Round($clock.Elapsed.TotalMinutes, 1)
          "minutes=$minutes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
          if ($code -ne 0) { throw "the toolset did not build ($code) after $minutes minutes" }
          New-Item -ItemType Directory -Force -Path wix-feed | Out-Null
          foreach ($id in 'WixToolset.Sdk', 'WixToolset.Util.wixext', 'WixToolset.Firewall.wixext') {
            $pkg = Get-ChildItem (Join-Path $src 'build\artifacts') -Filter "$id.*.nupkg" | Where-Object { $_.Name -match "^$([regex]::Escape($id))\.\d" } | Select-Object -First 1
            if (-not $pkg) { throw "the build made no $id package" }
            Copy-Item $pkg.FullName wix-feed
          }
          $mb = [math]::Round(((Get-ChildItem wix-feed -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          "#### M17: the WiX toolset built from its source at $($pin.tag) ($($pin.commit))", '', "- built in $minutes minutes on windows-2025 (upstream's own test runs left out); the feed holds $mb MB", '' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
      - name: M17's answer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ steps.build.outcome }}' -eq 'failure') {
            "#### M17: the WiX toolset did not build from its source on the runner", '', "- after ${{ steps.build.outputs.minutes }} minutes; Inno Setup builds the installer (PLAN.md §9 decision 3)", '' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
            exit 0
          }
          if ('${{ steps.cache.outputs.cache-hit }}' -eq 'true') {
            "#### M17: the WiX toolset from the cache (built from its source at the pinned commit)", '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          }
          New-Item -ItemType Directory -Force -Path installer/wix/feed | Out-Null
          Copy-Item wix-feed/*.nupkg installer/wix/feed
          ./installer/wix/probe.ps1 -Feed installer/wix/feed -Exe "$env:SystemRoot\System32\whoami.exe"

  installer:
    if: ${{ !inputs.d3d12 }}
    runs-on: windows-2025
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}\.ffmpeg\lib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: FFmpeg 9.0.2's LGPL shared libraries (the installer's)
        shell: pwsh
        run: |
          # The same pinned lgpl-shared build both test jobs load (see the windows job).
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n9.0.2-17-g2a571b6068-win64-lgpl-shared-9.0.zip' -OutFile lgpl.zip
          $hash = (Get-FileHash lgpl.zip -Algorithm SHA256).Hash
          if ($hash -ne '7157177B8A6CB2174C1650BA8C71B363F2C78CBA5330F88C4C02CF5B2B880646') { throw "lgpl.zip is not the pinned build ($hash)" }
          Expand-Archive lgpl.zip -DestinationPath lgpl
          New-Item -ItemType Directory -Force -Path .ffmpeg\lib | Out-Null
          Copy-Item ((Get-ChildItem lgpl -Directory | Select-Object -First 1).FullName + '\bin\*.dll') .ffmpeg\lib
      - name: The Agility SDK (its runtime for the installer)
        shell: pwsh
        run: ./tools/ci-d3d12.ps1 -Restore -Into d3d12
      - name: Inno Setup 7.1 (pinned)
        shell: pwsh
        run: |
          # Inno Setup 7.1.0 (Jordan Russell's licence: any use; a commercial user is asked, not required, to buy a licence), pinned
          # by hash and installed for this job only.
          $ErrorActionPreference = 'Stop'
          $page = (Invoke-WebRequest -Uri 'https://jrsoftware.org/isdl.php' -UseBasicParsing).Links.href | Where-Object { $_ -match 'innosetup-7\.1[^/]*\.exe$' } | Select-Object -Unique
          Write-Host "Inno Setup 7.1 links: $($page -join ', ')"
          $url = $page | Select-Object -First 1
          if (-not $url) { throw 'no Inno Setup 7.1 download on jrsoftware.org/isdl.php' }
          if ($url -notmatch '^https?:') { $url = "https://jrsoftware.org/$($url.TrimStart('/'))" }
          Invoke-WebRequest -Uri $url -OutFile is.exe
          $hash = (Get-FileHash is.exe -Algorithm SHA256).Hash
          $pin = 'UNPINNED'
          if ($hash -ne $pin) { throw "$url is not the pinned build ($hash)" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          Start-Process .\is.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup did not install ISCC.exe in $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
      - name: libvmx (OMT's codec, beside the exe)
        shell: pwsh
        run: |
          # Built from the vendored source with its upstream Windows command (src/ThirdParty/libvmx/build/buildwinx64clang.cmd).
          $ErrorActionPreference = 'Stop'
          $clang = (Get-Command clang++.exe -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $clang = Join-Path $vs 'VC\Tools\Llvm\x64\bin\clang++.exe'
          }
          New-Item -ItemType Directory -Force -Path vmx | Out-Null
          $src = 'src/ThirdParty/libvmx'
          & $clang -O3 -std=c++17 -fdeclspec -mlzcnt -mavx2 -mbmi -shared "-Wl,/DEF:$src/exports.def" "$src/src/vmxcodec_x86.cpp" "$src/src/vmxcodec_avx2.cpp" "$src/src/vmxcodec.cpp" -o vmx/libvmx.dll
          if ($LASTEXITCODE -ne 0) { throw "libvmx did not build ($LASTEXITCODE)" }
      - name: Publish (ReadyToRun) and the supervisor
        id: publish
        run: |
          dotnet publish src/PlayMap.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish/PlayMap -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
          dotnet publish src/PlayMap.Supervisor -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/supervisor -p:PlayMapRun=${{ github.run_number }} -p:PlayMapCommit=${{ github.sha }}
      - name: The installers (this build and the one before it)
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = [long]'${{ github.run_number }}'
          $common = @{ Commit = '${{ github.sha }}'; Publish = 'publish/PlayMap'; Supervisor = 'publish/supervisor'; Ffmpeg = '.ffmpeg/lib'; D3D12 = 'd3d12/D3D12'; Vmx = 'vmx/libvmx.dll'; Iscc = $env:ISCC }
          # The previous build: the same files numbered one build lower, which this build upgrades.
          $GITHUB_OUTPUT_SAVED = $env:GITHUB_OUTPUT; $env:GITHUB_OUTPUT = Join-Path $env:RUNNER_TEMP 'previous.txt'
          ./installer/build-installer.ps1 -Run ($run - 1) -Out previous @common
          $previous = @{}; Get-Content $env:GITHUB_OUTPUT | ForEach-Object { $k, $v = $_ -split '=', 2; $previous[$k] = $v }
          $env:GITHUB_OUTPUT = $GITHUB_OUTPUT_SAVED
          ./installer/build-installer.ps1 -Run $run -Out artifact @common
          "previous=$($previous.installer)", "previousVersion=$($previous.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
      - name: The release order
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An installer's version is greater than the last release's, or nothing is released (docs/round3/PLAN.md §1.3, rule 3).
          $ErrorActionPreference = 'Stop'
          $last = ''
          $tag = gh release view --repo '${{ github.repository }}' --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $tag) { $last = gh release view $tag --repo '${{ github.repository }}' --json body --jq '.body' | Select-String -Pattern 'installer version (\d+\.\d+\.\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1 }
          ./publish/supervisor/PlayMap.Supervisor.exe version-check '${{ steps.build.outputs.version }}' "$last" --out order.txt
          $code = $LASTEXITCODE
          $words = (Get-Content order.txt -Raw).Trim()
          "#### The release order", '', "- $words", '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          if ($code -ne 0) { throw $words }
      - name: InstallerTests and UnsignedArtifactTests (elevated)
        shell: pwsh
        env:
          PLAYMAP_INSTALLER: ${{ steps.build.outputs.installer }}
          PLAYMAP_INSTALLER_VERSION: ${{ steps.build.outputs.version }}
          PLAYMAP_INSTALLER_PREVIOUS: ${{ steps.build.outputs.previous }}
          PLAYMAP_INSTALLER_PREVIOUS_VERSION: ${{ steps.build.outputs.previousVersion }}
          PLAYMAP_ARTIFACT_DIR: ${{ github.workspace }}\artifact
        run: |
          $ErrorActionPreference = 'Stop'
          ./installer/sums.ps1 -Folder artifact -Notice
          dotnet test installer/tests/PlayMap.Installer.Tests -c Release --logger "trx;LogFileName=PlayMap.Installer.Tests.trx" --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type none
          if ($LASTEXITCODE -ne 0) { throw "the installer's tests failed ($LASTEXITCODE)" }
          "#### The installer", '', "- ``$(Split-Path $env:PLAYMAP_INSTALLER -Leaf)`` (installer version $env:PLAYMAP_INSTALLER_VERSION, $([math]::Round((Get-Item $env:PLAYMAP_INSTALLER).Length / 1MB, 1)) MB): installed, upgraded from $env:PLAYMAP_INSTALLER_PREVIOUS_VERSION, a downgrade refused, uninstalled, on windows-2025 (InstallerTests)", '' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
      - name: M9 on the runner (a probe, not a gate)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        run: |
          # The supervisor's session calls asked as LocalSystem through a scheduled task, as the service asks them; the answer, yes
          # or no, goes to the summary. A task the runner refuses is an answer too.
          $exe = (Resolve-Path publish/supervisor/PlayMap.Supervisor.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'session-probe.md'
          $task = 'PlayMap session probe'
          try {
            Register-ScheduledTask -TaskName $task -Action (New-ScheduledTaskAction -Execute $exe -Argument "session-probe --out `"$out`"") `
              -Principal (New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\SYSTEM' -LogonType ServiceAccount -RunLevel Highest) -Force | Out-Null
            Start-ScheduledTask -TaskName $task
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            while (-not (Test-Path $out) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Seconds 2 }
            Unregister-ScheduledTask -TaskName $task -Confirm:$false
          } catch { "#### M9: the supervisor's session calls", '', "- could not be asked: $($_.Exception.Message)", '' | Out-File -FilePath $out -Encoding utf8NoBOM }
          if (-not (Test-Path $out)) { "#### M9: the supervisor's session calls", '', '- no answer within 90 s', '' | Out-File -FilePath $out -Encoding utf8NoBOM }
          Get-Content $out | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8NoBOM
          Get-Content $out | Write-Host
      - name: Upload the installer
        if: ${{ success() }}
        uses: actions/upload-artifact@v5
        with:
          name: PlayMap-${{ steps.build.outputs.file }}-win-x64-unsigned-installer
          path: artifact
      - name: Upload the installer's test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-installer
          path: "installer/tests/**/TestResults/*.trx"
          if-no-files-found: ignore
