name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Every suite on Linux: headless OpenGL through Mesa (llvmpipe) under Xvfb, and FFmpeg 9.0's shared
  # libraries for the media suite (the binding's major version must match the libraries').
  test:
    runs-on: ubuntu-latest
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/lib
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Headless OpenGL and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 libgles2 libgl1 libglx-mesa0 libglfw3 libfontconfig1 fonts-dejavu-core
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: FFmpeg 9.0 shared libraries
        run: |
          mkdir -p .ffmpeg
          curl -sSL -o ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz"
          tar -xJf ff.tar.xz -C .ffmpeg --strip-components=1
          echo "$GITHUB_WORKSPACE/.ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Restore
        run: dotnet restore
      - name: Build (the analyzers are fences)
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The Windows build: the exe the show machine runs, and every suite. Its runner has no GPU and no audio endpoint:
  # OpenGL is Mesa's software rasteriser (llvmpipe, from mesa-dist-win) and FFmpeg is 9.0's shared libraries, as on Linux.
  windows:
    runs-on: windows-latest
    env:
      PLAYMAP_FFMPEG_DIR: ${{ github.workspace }}\.ffmpeg\bin
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: FFmpeg 9.0 shared libraries
        run: |
          curl.exe -sSfL -o ff.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip"
          Expand-Archive ff.zip -DestinationPath .ffmpeg-zip
          Move-Item (Get-ChildItem .ffmpeg-zip -Directory | Select-Object -First 1).FullName .ffmpeg
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\.ffmpeg\bin"
          Get-ChildItem .ffmpeg\bin -Filter *.dll | ForEach-Object Name
      - name: Mesa's software OpenGL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "mesa3d-*-release-msvc.7z" --dir .mesa-dl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $archive = Get-ChildItem .mesa-dl -Filter *.7z | Select-Object -First 1
          Write-Output "Mesa: $($archive.Name)"
          7z x $archive.FullName "-o.mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path .mesa\x64\opengl32.dll)) { Write-Output "::error::the Mesa archive has no x64\opengl32.dll"; exit 1 }
          Get-ChildItem .mesa\x64 -Filter *.dll | ForEach-Object Name
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      # Windows looks for opengl32.dll beside the process's exe before System32, so Mesa's goes beside every exe that draws:
      # dotnet.exe (the node host and any dotnet-hosted test host) and each test output folder (testhost.exe).
      - name: Mesa beside the processes that draw
        run: |
          $folders = @($env:DOTNET_ROOT) + (Get-ChildItem tests -Directory | ForEach-Object { Join-Path $_.FullName 'bin\Release\net10.0' } | Where-Object { Test-Path $_ })
          foreach ($folder in $folders) {
            Copy-Item .mesa\x64\*.dll $folder -Force
            Write-Output "Mesa beside $folder"
          }
      # PowerShell goes on past a native command's exit code, so each project's result is taken from $LASTEXITCODE and the
      # step fails at its end naming every project that failed: one failure hides no other project's result.
      - name: Test (every project to its end)
        run: |
          $failed = @()
          foreach ($project in Get-ChildItem tests\*\*.csproj) {
            $name = $project.BaseName
            Write-Output "::group::$name"
            dotnet test $project.FullName -c Release --no-build --logger "trx;LogFileName=$name.trx"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Output "::endgroup::"
          }
          if ($failed.Count -gt 0) { Write-Output "::error::failed: $($failed -join ', ')"; exit 1 }
          exit 0
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      - name: Publish the portable exe
        run: dotnet publish src/PlayMap.App -c Release -r win-x64 --self-contained true -o publish/PlayMap
      - name: Upload the exe
        uses: actions/upload-artifact@v5
        with:
          name: PlayMap-win-x64
          path: publish/PlayMap
